[project]
name = "navigate-helper"
version = "0.1.0"
description = "Dutch question answering over the Aryza Navigate Manual (RAG)"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "gradio>=6.27.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.2",
    "markdownify>=1.2.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "nbstripout>=0.9.1",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: uses the real e5 model (downloads about 1 GB on first run)"]
